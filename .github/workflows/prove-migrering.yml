name: Prøv migreringen (midlertidig)

# Bygger en tom database med migreringene før og etter den nye, og kjører
# supabase/tests/regler.sql begge ganger. Røres ikke den ekte databasen.
# Tas ut før PR-en slås sammen.

on:
  pull_request:
    paths: ["supabase/**", ".github/workflows/prove-migrering.yml"]

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Tom database med migreringene før den nye
        run: |
          mkdir lokal && cd lokal
          supabase init
          sed -i 's/^major_version = .*/major_version = 17/' supabase/config.toml
          mkdir -p supabase/migrations
          cp ../supabase/migrations/*.sql supabase/migrations/
          rm supabase/migrations/20261104120000_ubrukt_ut.sql
          supabase db start
      - name: Reglene før (fra main)
        run: |
          git show origin/main:supabase/tests/regler.sql > regler-for.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f regler-for.sql 2>&1 | tee for.txt || true
      - name: Den nye migreringen
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261104120000_ubrukt_ut.sql
      - name: Reglene etter
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/tests/regler.sql 2>&1 | tee etter.txt || true
          grep -q "RESULTAT" etter.txt
          ! grep -q "^FEIL\|	FEIL\| FEIL " etter.txt
      - name: Alle migreringene på en tom database
        run: |
          cd lokal && supabase db stop --no-backup
          cp ../supabase/migrations/20261104120000_ubrukt_ut.sql supabase/migrations/
          supabase db start
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f ../supabase/tests/regler.sql 2>&1 | tail -3
