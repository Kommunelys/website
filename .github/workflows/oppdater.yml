name: Oppdater

# ADR-010: én arbeidsflyt, ikke tre. En commit som Actions dytter med
# standardtokenet utløser IKKE andre arbeidsflyter, så en kjede av
# push-utløsere ville stoppet stille etter første jobb.

on:
  # Tidsplanen er slått av til innhentingen er avklart med kommunen (ADR-007),
  # og analyse og nettsted er bygget. Fjern kommentartegnene for å slå den på.
  # schedule:
  #   # 05:17 UTC på hverdager. Skjevt minutt med vilje: planlagte kjøringer på
  #   # hel time blir oftere forsinket. Cron i Actions er uansett ikke punktlig,
  #   # noe som ikke betyr noe her siden protokoller kommer dager etter møtet.
  #   - cron: "17 5 * * 1-5"
  workflow_dispatch:
    inputs:
      aar:
        description: "År som skal hentes"
        required: false
        default: "2026"
      alt:
        description: "Tving full henting (treg, bruk ved førstegangsoppsett)"
        type: boolean
        default: false
      proeveanalyse:
        description: "Prøveanalyse: sak-ID-er med komma, høyst 10. Hopper over henting og publisering"
        required: false
        default: ""
      analyse_maks:
        description: "Høyst antall saker AI-analysen sender inn i denne kjøringen"
        required: false
        default: "25"

concurrency:
  group: oppdater
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  # Driftssiden (/drift/) leser kjøringene og jobbresultatene fra API-et.
  actions: read

jobs:
  # Prøveanalyse: analysen kjøres på utvalgte saker, og resultatet lastes opp
  # som en fil. Ingenting committes eller publiseres, og innhenting og bygging
  # hoppes over, så portalen ikke kalles.
  proeve:
    name: Prøveanalyse (lagres ikke)
    if: ${{ inputs.proeveanalyse }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r krav.txt

      - name: Analyser utvalgte saker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SAKER: ${{ inputs.proeveanalyse }}
          AAR: ${{ inputs.aar || '2026' }}
        run: python -m analyser.analyser_saker "$AAR" --saker "$SAKER" --maks 10

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proeveanalyse
          path: data/analyse/
          retention-days: 7
          if-no-files-found: warn

  hent:
    name: Hent og tolk
    if: ${{ !inputs.proeveanalyse }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          pip install -r krav.txt

      - name: Hent møter og saker
        run: |
          python -m hent.hent_moter "${{ inputs.aar || '2026' }}" \
            ${{ inputs.alt && '--alt' || '' }}

      - name: Hent medlemslister
        run: python -m hent.hent_medlemmer "${{ inputs.aar || '2026' }}"

      - name: Bygg saker og saksgang
        run: python -m tolk.bygg_saker "${{ inputs.aar || '2026' }}"

      # Henter bare dokumenter som ikke har tekst fra før (ADR-013).
      - name: Hent tekst fra saksframlegg og vedtak
        run: python -m hent.hent_dokumenter "${{ inputs.aar || '2026' }}"

      - name: Tolk voteringer
        run: python -m tolk.bygg_voteringer "${{ inputs.aar || '2026' }}"

      - name: Les oppmøte og kontroller stemmene
        run: python -m tolk.bygg_oppmote "${{ inputs.aar || '2026' }}"

      - name: Bygg utvalg og verv
        run: python -m tolk.bygg_verv "${{ inputs.aar || '2026' }}"

      # Voteringer med avvik holdes tilbake i bygget til de er vurdert.
      - name: Samle avvik til vurdering
        run: python -m tolk.bygg_avvik "${{ inputs.aar || '2026' }}"

      - name: Lagre endringer
        run: |
          git config user.name "oppdater-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Data: oppdatert $(date -I)"
          git push

  # Fase 2. Sender bare nye og endrede saker, høyst analyse_maks per kjøring
  # (25 som standard). Første gjennomgang av et helt år tar over en time, så
  # analysen slutter å sende nye saker etter 150 minutter, og det som er gjort,
  # lagres selv om jobben feiler.
  analyser:
    name: AI-analyse
    needs: hent
    if: ${{ !inputs.proeveanalyse }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r krav.txt

      - name: Analyser nye og endrede saker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAKS: ${{ inputs.analyse_maks || '25' }}
          AAR: ${{ inputs.aar || '2026' }}
        run: python -m analyser.analyser_saker "$AAR" --maks "$MAKS" --minutter 150

      - name: Lagre analyser
        if: always()
        run: |
          git config user.name "oppdater-bot"
          git config user.email "actions@users.noreply.github.com"
          # Commit før pull: endrede analyser er ucommittede endringer, og
          # «git pull --rebase» nekter å kjøre med dem (3.10.2026 gikk 16
          # analyser tapt slik). Hent-jobben har pushet data/ i mellomtiden.
          git add data/analyse/ data/drift/
          git diff --staged --quiet || git commit -m "Analyse: oppdatert $(date -I)"
          git pull --rebase
          git push

  # Publiserer selv om analysen feilet; sakene vises da uten nye sammendrag.
  bygg:
    name: Bygg og publiser
    needs: [hent, analyser]
    if: ${{ always() && needs.hent.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publiser.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          # Driftssiden sammenligner hver datacommit med den forrige.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r krav.txt

      # Stopper publisering hvis noe ser galt ut. Se docs/01-arkitektur.md.
      - name: Kontroller
        run: python -m tester.kontroller

      # Før bygget: 404-siden trenger roten til nettstedet (base_path er
      # «/website» på github.io og tom med eget domene).
      - id: pages
        uses: actions/configure-pages@v5

      - name: Bygg nettsted
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m bygg.bygg_nettsted
        env:
          NETTSTED_BASE: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: nettsted
      - id: publiser
        uses: actions/deploy-pages@v4
