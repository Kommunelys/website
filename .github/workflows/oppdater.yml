name: Oppdater

# ADR-010: én arbeidsflyt, ikke tre. En commit som Actions dytter med
# standardtokenet utløser IKKE andre arbeidsflyter, så en kjede av
# push-utløsere ville stoppet stille etter første jobb.

on:
  # Slått på av prosjekteier 4.10.2026. ADR-007 er fortsatt åpen; innhentingen
  # holder ett kall i sekundet og stoppes straks hvis kommunen ber om det.
  schedule:
    # 05:17 UTC på hverdager. Skjevt minutt med vilje: planlagte kjøringer på
    # hel time blir oftere forsinket. Cron i Actions er uansett ikke punktlig,
    # noe som ikke betyr noe her siden protokoller kommer dager etter møtet.
    - cron: "17 5 * * 1-5"
  workflow_dispatch:
    inputs:
      aar:
        description: "År som skal hentes (tomt: i år)"
        required: false
        default: ""
      alt:
        description: "Tving full henting (treg, bruk ved førstegangsoppsett)"
        type: boolean
        default: false
      proeveanalyse:
        description: "Prøveanalyse: sak-ID-er med komma, høyst 10. Hopper over henting og publisering"
        required: false
        default: ""
      analyse_maks:
        description: "Høyst antall saker AI-analysen sender inn i denne kjøringen"
        required: false
        default: "25"

concurrency:
  group: oppdater
  cancel-in-progress: false

# ADR-019: dataene ligger i databasen (Postgres i Supabase), og hver jobb leser
# og skriver der. Ingenting committes; data/ i git står som det var 6.10.2026.
permissions:
  contents: read
  pages: write
  id-token: write
  # Driftssiden (i portalen) leser kjøringene og jobbresultatene fra API-et.
  actions: read

env:
  KOMMUNELYS_LAGER: pg
  # Året som skal hentes og bygges. Tomt betyr i år; skriptene bruker da
  # ${AAR_INN:-$(date -u +%Y)}, så innhenting og bygg alltid gjelder samme år.
  AAR_INN: ${{ inputs.aar }}
  KOMMUNELYS_DB_URL: ${{ secrets.KOMMUNELYS_DB_URL }}

jobs:
  # Prøveanalyse: analysen kjøres på utvalgte saker, og resultatet lastes opp
  # som en fil. Ingenting lagres i databasen eller publiseres, og innhenting og
  # bygging hoppes over, så portalen ikke kalles.
  proeve:
    name: Prøveanalyse (lagres ikke)
    if: ${{ inputs.proeveanalyse }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r krav.txt

      - name: Analyser utvalgte saker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SAKER: ${{ inputs.proeveanalyse }}
        run: python -m analyser.analyser_saker "${AAR_INN:-$(date -u +%Y)}" --saker "$SAKER" --maks 10 --til-mappe proeveanalyse

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proeveanalyse
          path: proeveanalyse/
          retention-days: 7
          if-no-files-found: warn

  hent:
    name: Hent og tolk
    if: ${{ !inputs.proeveanalyse }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      # Kommunene der innhentingen feilet, med komma mellom.
      feilet: ${{ steps.hent.outputs.feilet }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          pip install -r krav.txt

      # Alle kommunene med status «intern» eller «publisert», etter tur, så
      # takten mot portalen gjelder samlet (ADR-007, ADR-021). For hver kommune:
      # speil filene som vedlikeholdes for hånd, hent møter, saker, medlemslister
      # og dokumenter, og tolk saksgang, voteringer, oppmøte, verv og avvik, for
      # alle årene fra kommunens «fra_aar» (en sak kan gå over flere år, ADR-022).
      # Se kjor/alle.py. Feiler en kommune, fortsetter de andre; den beholder
      # forrige versjon på nettstedet.
      - name: Hent og tolk alle kommunene
        id: hent
        run: |
          python -m kjor.alle hent "${AAR_INN:-$(date -u +%Y)}" \
            ${{ inputs.alt && '--alt' || '' }}

  # Sender bare nye og endrede saker, høyst analyse_maks per kjøring (25 som
  # standard). Første gjennomgang av et helt år tar over en time, så analysen
  # slutter å sende nye saker etter 150 minutter. Hver analyse lagres i
  # databasen med en gang, så ingenting går tapt om jobben feiler.
  analyser:
    name: AI-analyse
    needs: hent
    if: ${{ !inputs.proeveanalyse }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r krav.txt

      - name: Analyser nye og endrede saker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAKS: ${{ inputs.analyse_maks || '25' }}
        # Antallet og tiden deles mellom kommunene (kjor/alle.py).
        run: python -m kjor.alle analyser "${AAR_INN:-$(date -u +%Y)}" --maks "$MAKS" --minutter 150

  # Publiserer selv om analysen feilet; sakene vises da uten nye sammendrag.
  bygg:
    name: Bygg og publiser
    needs: [hent, analyser]
    if: ${{ always() && needs.hent.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publiser.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Driftssiden viser også endringene fra før byttet, fra git.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r krav.txt

      # Før bygget: 404-siden trenger roten til nettstedet (base_path er
      # «/website» på github.io og tom med eget domene).
      - id: pages
        uses: actions/configure-pages@v5

      # Kontrollene og bygget for hver kommune, så det felles (kjor/alle.py).
      # En kommune som stopper i kontrollene, eller der innhentingen feilet,
      # beholder versjonen som er publisert nå. Se docs/01-arkitektur.md.
      - name: Kontroller og bygg nettstedet
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NETTSTED_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          python -m kjor.alle bygg "${AAR_INN:-$(date -u +%Y)}" \
            --hopp-over "${{ needs.hent.outputs.feilet }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: nettsted
      - id: publiser
        uses: actions/deploy-pages@v4

  # GitHub slår av planlagte kjøringer etter 60 dager uten aktivitet i repoet.
  # Før byttet holdt de daglige datacommitene repoet aktivt; nå slås
  # arbeidsflytene på igjen ved hver planlagte kjøring. GitHub sender også
  # e-post før en tidsplan slås av, og driftssiden viser når siste kjøring var.
  holdlevende:
    name: Hold tidsplanen aktiv
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Slå på Oppdater og Sikkerhetskopi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for fil in oppdater.yml sikkerhetskopi.yml; do
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$fil/enable"
          done
